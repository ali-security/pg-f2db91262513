name: Releases

on:
  workflow_dispatch:

jobs:
  build:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v2
      - uses: ncipollo/release-action@v1
        with:
          body:
            Please refer to [CHANGELOG.md](https://github.com/go-pg/pg/blob/v10/CHANGELOG.md) for
            details
